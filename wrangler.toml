name = "fitgirl-notificator"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Runs every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# Active notification channel: "telegram" or "callmebot".
NOTIFIER = "telegram"
FEED_URL = "https://fitgirl-repacks.site/feed/"
MAX_NOTIFICATIONS_PER_RUN = "5"
SEEN_TTL_DAYS = "30"
# Only posts in this category are notified, which filters out the site's
# recurring non-release posts ("Upcoming Repacks", "Updates Digest").
# Set to "" to notify every feed entry.
REQUIRE_CATEGORY = "Lossless Repack"

# Created with: wrangler kv namespace create SEEN_RELEASES
# The namespace id is an identifier, not a credential: it is meant to be
# versioned. Access is granted by the account's own auth, never by this id.
[[kv_namespaces]]
binding = "SEEN_RELEASES"
id = "52fe2590630f460ea0c54198fd23e314"

# Secrets are NEVER stored here. Load the ones for the active channel:
#   NOTIFIER = "telegram"   -> wrangler secret put TELEGRAM_BOT_TOKEN
#                              wrangler secret put TELEGRAM_CHAT_ID
#   NOTIFIER = "callmebot"  -> wrangler secret put CALLMEBOT_PHONE
#                              wrangler secret put CALLMEBOT_API_KEY

[observability]
enabled = true
